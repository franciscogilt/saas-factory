# Fábrica en piloto automático: cada lunes lanza nuevos SaaS sin que hagas nada.
# Configura los secretos en: Settings → Secrets and variables → Actions
# (los mismos nombres que en .env) y la variable FACTORY_NICHE en la pestaña "Variables".
name: SaaS Factory

on:
  schedule:
    - cron: "17 13 * * 1"        # lunes 9:17 (hora de Santo Domingo)
  workflow_dispatch:              # también puedes lanzarla a mano desde la pestaña Actions
    inputs:
      niche:
        description: "Nicho (vacío = usa la variable FACTORY_NICHE)"
        required: false
      count:
        description: "Cuántos SaaS lanzar"
        default: "2"

concurrency: saas-factory

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci || npm install
      - name: Ejecutar la fábrica
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ vars.FACTORY_GITHUB_OWNER }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_ID: ${{ vars.SUPABASE_ORG_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          MAX_TOKENS_PER_PROJECT: ${{ vars.MAX_TOKENS_PER_PROJECT || '8000000' }}
        run: |
          git config --global user.email "factory@saas.local"
          git config --global user.name "SaaS Factory"
          npm run factory -- auto "${{ inputs.niche || vars.FACTORY_NICHE }}" -n "${{ inputs.count || '2' }}"
      - name: Guardar estado y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-state-${{ github.run_id }}
          path: projects/*/.factory/
          retention-days: 90
