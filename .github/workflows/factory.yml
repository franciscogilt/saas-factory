# Fábrica en piloto automático: cada lunes lanza nuevos SaaS sin que hagas nada.
# Configura en Settings → Secrets and variables → Actions:
#   Secrets:   CLAUDE_CODE_OAUTH_TOKEN (tu plan de Claude, sin clave de API: genéralo con `claude setup-token`),
#              FACTORY_GITHUB_TOKEN, VERCEL_TOKEN, SUPABASE_ACCESS_TOKEN, STRIPE_SECRET_KEY
#   (Opcional: ANTHROPIC_API_KEY + variable FACTORY_ENGINE=api si prefieres pagar por tokens.)
#   Variables: FACTORY_NICHE, FACTORY_GITHUB_OWNER, SUPABASE_ORG_ID (y VERCEL_TEAM_ID si usas equipo)
#   STRIPE_SECRET_KEY es opcional: sin ella se publica sin cobros (planes de pago «Próximamente»).
#
# Modo «publicar»: sube un SaaS ya construido de generated/<slug> (p. ej. menufacil) sin usar Claude.
# Se puede repetir: reutiliza el repositorio, la base de datos y el proyecto de Vercel ya creados.
name: SaaS Factory

on:
  schedule:
    - cron: "17 13 * * 1"        # lunes 9:17 (hora de Santo Domingo)
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué hacer"
        type: choice
        options: [lanzar, publicar, probar-sin-publicar, solo-revisar-claves]
        default: lanzar
      niche:
        description: "Nicho (vacío = usa la variable FACTORY_NICHE)"
        required: false
      count:
        description: "Cuántos SaaS lanzar"
        default: "2"
      slug:
        description: "Modo publicar: qué SaaS ya construido (carpeta de generated/)"
        default: "menufacil"

concurrency: saas-factory

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ENGINE: ${{ vars.FACTORY_ENGINE || 'claude-code' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ vars.FACTORY_ENGINE == 'api' && secrets.ANTHROPIC_API_KEY || '' }}
      GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ vars.FACTORY_GITHUB_OWNER }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG_ID: ${{ vars.SUPABASE_ORG_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      MAX_TOKENS_PER_PROJECT: ${{ vars.MAX_TOKENS_PER_PROJECT || '8000000' }}
      DEMO_WHATSAPP: ${{ vars.DEMO_WHATSAPP }}
      MODE: ${{ inputs.mode || 'lanzar' }}
    steps:
      - uses: actions/checkout@v7

      # La ejecución programada se pausa (sin fallar ni enviarte correos de error) mientras falte configuración.
      # Si la lanzas a mano, sigue siempre, para que "Revisar claves" te diga exactamente qué falta.
      - name: ¿Está configurada?
        id: cfg
        env:
          NICHE: ${{ inputs.niche || vars.FACTORY_NICHE }}
        run: |
          missing=""
          if [ "$MODE" != "publicar" ]; then
            if [ "$ENGINE" = "api" ]; then [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
            else [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || missing="$missing CLAUDE_CODE_OAUTH_TOKEN"; fi
            [ -n "$NICHE" ] || missing="$missing FACTORY_NICHE"
          fi
          for v in GITHUB_TOKEN GITHUB_OWNER VERCEL_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_ORG_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            { echo "## ⏸️ Piloto automático en pausa"; echo; echo "Falta configurar:$missing"; echo;
              echo "Añádelo en Settings → Secrets and variables → Actions. Mientras tanto, esta ejecución semanal no hace nada."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Piloto automático en pausa: falta$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.cfg.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.cfg.outputs.ready == 'true'
      - name: Instalar Claude Code
        if: ${{ steps.cfg.outputs.ready == 'true' && vars.FACTORY_ENGINE != 'api' && inputs.mode != 'publicar' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Revisar claves
        if: steps.cfg.outputs.ready == 'true'
        run: npm run -s factory -- doctor ${{ inputs.mode == 'probar-sin-publicar' && '--ai-only' || inputs.mode == 'publicar' && '--no-ai' || '' }}

      - name: Publicar un SaaS ya construido
        if: ${{ steps.cfg.outputs.ready == 'true' && inputs.mode == 'publicar' }}
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          if ! [[ "$SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || [ ! -f "generated/$SLUG/.factory/state.json" ]; then
            echo "::error::No hay ningún SaaS listo en generated/$SLUG. Disponibles: $(ls generated | grep -v README | tr '\n' ' ')"; exit 1
          fi
          mkdir -p projects
          rsync -a --exclude node_modules --exclude .next --exclude screenshots "generated/$SLUG/" "projects/$SLUG/"
          git config --global user.email "factory@saas.local"
          git config --global user.name "SaaS Factory"
          npm run -s factory -- deploy "$SLUG" --seed

      - name: Ejecutar la fábrica
        if: ${{ steps.cfg.outputs.ready == 'true' && inputs.mode != 'solo-revisar-claves' && inputs.mode != 'publicar' }}
        env:
          NICHE: ${{ inputs.niche || vars.FACTORY_NICHE }}
          COUNT: ${{ inputs.count || '2' }}
        run: |
          if [ -z "$NICHE" ]; then echo "::error::Define la variable FACTORY_NICHE o escribe un nicho al lanzar."; exit 1; fi
          git config --global user.email "factory@saas.local"
          git config --global user.name "SaaS Factory"
          if [ "${{ inputs.mode }}" = "probar-sin-publicar" ]; then
            npm run -s factory -- auto "$NICHE" -n 1 --no-deploy
          else
            npm run -s factory -- auto "$NICHE" -n "$COUNT"
          fi

      - name: Informe
        if: ${{ always() && steps.cfg.outputs.ready == 'true' }}
        run: npm run -s factory -- report >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar estado, registros y kits de lanzamiento
        if: ${{ always() && steps.cfg.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: factory-${{ github.run_id }}
          path: |
            projects/*/.factory/
            projects/*/docs/
          if-no-files-found: ignore
          retention-days: 90

      - name: Empaquetar código generado (modo prueba)
        if: ${{ always() && steps.cfg.outputs.ready == 'true' && inputs.mode == 'probar-sin-publicar' }}
        run: |
          mkdir -p out
          for d in projects/*/; do
            [ -d "$d" ] && (cd projects && zip -qr "../out/$(basename "$d").zip" "$(basename "$d")" -x "*/node_modules/*" "*/.next/*")
          done
          ls out || true

      - name: Subir código generado
        if: ${{ always() && steps.cfg.outputs.ready == 'true' && inputs.mode == 'probar-sin-publicar' }}
        uses: actions/upload-artifact@v7
        with:
          name: saas-generado-${{ github.run_id }}
          path: out/*.zip
          if-no-files-found: ignore
          retention-days: 30
